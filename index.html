<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAISON OPHIR — Perfume House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141316; --bg-soft:#1C1B1F; --bg-panel:#242226;
    --ink:#EDEDED; --ink-dim: rgba(237,237,237,0.62);
    --gold:#C9A576; --gold-light:#E3C6A3; --gold-deep:#9A7A52;
    --silver:#C7CCD3; --silver-light:#E8EAEE;
    --sapphire:#22308F; --sapphire-glow:#4E63D6;
    --line: rgba(237,237,237,0.12); --gold-line: rgba(201,165,118,0.35);
    --danger:#B4573F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ font-family:'Jost', sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; overflow-x:hidden; position:relative; }
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 1200px 700px at 15% -5%, rgba(212,175,55,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 1000px 600px at 100% 30%, rgba(34,48,143,0.07) 0%, transparent 55%),
      radial-gradient(ellipse 900px 900px at 50% 100%, rgba(212,175,55,0.05) 0%, transparent 60%);
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.5;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }
  header, .hero, .section, footer, .newsletter, .best-band{position:relative; z-index:1;}
  h1,h2,h3,.serif{ font-family:'Playfair Display', serif; font-weight:500; letter-spacing:0.015em; }
  .eyebrow{ font-size:0.72rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold); font-weight:500; }
  a{color:inherit; text-decoration:none;}
  img{display:block; width:100%; height:100%; object-fit:cover;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  input,select,textarea{font-family:inherit;}
  .wrap{max-width:1280px; margin:0 auto; padding:0 40px;}
  .gem-divider{ width:26px; height:2px; background:linear-gradient(90deg, var(--sapphire), var(--sapphire-glow)); margin:14px auto 0; }
  .gem-icon{flex-shrink:0; width:34px; height:42px; object-fit:contain; display:block;}
  .foot-brand .gem-icon{width:26px; height:32px;}

  header{ position:sticky; top:0; z-index:200; background:rgba(11,11,11,0.4); border-bottom:1px solid transparent; transition:background .4s ease, border-color .4s ease, box-shadow .4s ease; }
  header.scrolled{ background:rgba(11,11,11,0.9); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); border-bottom:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,0.4); }
  .header-top{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:20px 40px 16px; max-width:1280px; margin:0 auto; }
  .header-top .side{display:flex; align-items:center; gap:20px;}
  .header-top .side.left{justify-content:flex-start;}
  .header-top .side.right{justify-content:flex-end;}
  .logo{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .logo-row{display:flex; align-items:center; gap:14px;}
  .logo-word{
    font-family:'Jost', sans-serif; font-size:1.7rem; letter-spacing:0.26em; font-weight:500; white-space:nowrap;
    background:linear-gradient(180deg, #F6F8FA 0%, #D7DBE1 28%, #9BA2AC 50%, #EFF1F4 74%, #C2C8D0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));
  }
  .logo-dot{display:inline-block; width:4px; height:4px; background:var(--gold); transform:rotate(45deg); margin:0 3px; vertical-align:3px;}
  .logo-sub{font-size:0.58rem; letter-spacing:0.4em; color:var(--gold); text-transform:uppercase; margin-top:1px;}
  .icon-btn{ position:relative; width:22px; height:22px; display:flex; align-items:center; justify-content:center; opacity:0.85; transition:opacity .25s ease, transform .25s ease; }
  .icon-btn:hover{opacity:1; transform:translateY(-1px);}
  .icon-btn svg{width:19px; height:19px; stroke:var(--ink); fill:none; stroke-width:1.4;}
  .badge{ position:absolute; top:-8px; right:-10px; background:var(--gold); color:#141414; font-size:0.62rem; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; }
  .search-wrap{display:flex; align-items:center; gap:8px; opacity:0.85;}
  .search-wrap input{ border:none; background:transparent; font-family:inherit; font-size:0.82rem; width:0; opacity:0; transition:width .35s ease, opacity .35s ease; outline:none; border-bottom:1px solid var(--line); color:var(--ink); }
  .search-wrap.active input{width:120px; opacity:1; padding-bottom:2px;}
  .burger{display:none;}
  .header-nav-row{ border-top:1px solid var(--line); }
  .nav-links{display:flex; justify-content:center; gap:44px; font-size:0.76rem; letter-spacing:0.18em; text-transform:uppercase; padding:15px 40px; max-width:1280px; margin:0 auto; }
  .nav-links a, .nav-links button.nav-link-btn{position:relative; padding-bottom:4px; color:var(--ink); opacity:0.72; font-weight:400; background:none; border:none; font-family:inherit; font-size:inherit; letter-spacing:inherit; text-transform:inherit; cursor:pointer;}
  .nav-links a::after, .nav-links button.nav-link-btn::after{ content:''; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--gold); transition:width .35s ease; }
  .nav-links a:hover, .nav-links button.nav-link-btn:hover{opacity:1;}
  .nav-links a:hover::after, .nav-links button.nav-link-btn:hover::after{width:100%;}
  .nav-links button.nav-link-btn.active{opacity:1;}
  .nav-links button.nav-link-btn.active::after{width:100%;}

  .hero{ position:relative; overflow:hidden; }
  .hero-photo{ display:block; width:100%; height:auto; transform-origin:50% 30%; will-change:transform; }
  .hero-scrim{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(20,19,22,0) 60%, rgba(20,19,22,0.15) 100%);
  }
  .hero-cta-hit{
    position:absolute; left:35%; bottom:6.5%; width:24%; height:6%;
    display:block; text-indent:-9999px;
  }

  .section{ padding:100px 0; }
  .section-title{ text-align:center; margin-bottom:50px; }
  .section-title h2{ font-size:2.4rem; margin-bottom:8px; }
  
  .perfume-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 30px;
    margin-top: 40px;
  }
  .perfume-card {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .perfume-card:hover {
    transform: translateY(-5px);
    border-color: var(--gold-line);
  }
  .perfume-img-wrapper {
    position: relative;
    width: 100%;
    padding-top: 125%; /* 4:5 Aspect Ratio */
    background: #000;
  }
  .perfume-img-wrapper img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .perfume-info {
    padding: 20px;
  }
  .perfume-brand {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--gold);
    margin-bottom: 5px;
  }
  .perfume-name {
    font-size: 1.2rem;
    font-family: 'Playfair Display', serif;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .perfume-desc {
    font-size: 0.85rem;
    color: var(--ink-dim);
    line-height: 1.5;
    margin-bottom: 15px;
    height: 68px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .perfume-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 15px;
  }
  .perfume-price {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--ink);
  }
  .btn-view {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gold);
    border-bottom: 1px solid var(--gold);
    padding-bottom: 2px;
    transition: color 0.3s, border-color 0.3s;
  }
  .btn-view:hover {
    color: var(--gold-light);
    border-color: var(--gold-light);
  }

  footer {
    background: #0b0b0b;
    border-top: 1px solid var(--line);
    padding: 60px 0;
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }
</style>
</head>
<body>

<header id="header">
  <div class="header-top">
    <div class="side left">
      <a href="#catalogo">Catálogo</a>
    </div>
    <div class="logo">
      <div class="logo-row">
        <span class="logo-word">MAISON OPHIR</span>
      </div>
      <span class="logo-sub">Haute Parfumerie</span>
    </div>
    <div class="side right">
      <a href="#contacto">Contacto</a>
    </div>
  </div>
</header>

<main>
  <!-- Sección Catálogo de Perfumes -->
  <section id="catalogo" class="section">
    <div class="wrap">
      <div class="section-title">
        <span class="eyebrow">Colección Exclusiva</span>
        <h2>Fragancias de Autor</h2>
        <div class="gem-divider"></div>
      </div>

      <div class="perfume-grid">
        
        <!-- Producto 1: Versace Eros Flame -->
        <div class="perfume-card">
          <div class="perfume-img-wrapper">
            <img src="https://i.postimg.cc/c1zp734V/Whats-App-Image-2026-08-04-at-9-07-44-PM.jpg" alt="Versace Eros Flame">
          </div>
          <div class="perfume-info">
            <div class="perfume-brand">Versace</div>
            <h3 class="perfume-name">Eros Flame</h3>
